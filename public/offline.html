<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#536345" />
    <title>Sprout is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #faf9f5; color: #2f3729; font-family: system-ui, sans-serif; }
      main { max-width: 440px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 28px; }
      p { margin: 0; color: #536345; line-height: 1.6; }
      button { min-height: 44px; margin-top: 24px; border: 0; border-radius: 12px; padding: 0 20px; background: #536345; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/sprout-icon.svg" alt="" />
      <h1>Sprout needs a connection</h1>
      <p>Your financial data is never cached for offline use. Reconnect to safely view or change your budget.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
